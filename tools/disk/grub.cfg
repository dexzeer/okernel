# Boot menu of the installed disk (tools/disk/mkdisk.py, layout in src/part.h).
# After a panic the desktop kernel writes next_entry=recovery into grubenv (src/panic.c): that boot, and only that one,
# starts the recovery desktop (the known-good kernel with `recovery`). Its `knowngood` command does the same for the
# known-good kernel as a normal desktop.
set timeout=0
set default=desktop
load_env
if [ "${next_entry}" ]; then
    set default="${next_entry}"
    set next_entry=
    save_env next_entry
fi
# the multiboot loader sets the video mode through these drivers (UEFI: GOP)
if [ "$grub_platform" = efi ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod all_video
fi
set gfxmode=auto
search --no-floppy --label KANRECOV --set=recov

menuentry "KAnarchy OS" --id desktop {
    set gfxpayload=1920x1080x32,auto
    multiboot /boot/kanarchy.bin
    module /boot/lxroot.tar
    boot
}
menuentry "KAnarchy recovery" --id recovery {
    set root=$recov
    set gfxpayload=1920x1080x32,auto
    multiboot /known/kanarchy.bin recovery
    boot
}
menuentry "KAnarchy OS with the known-good kernel (recovery partition)" --id knowngood {
    set root=$recov
    set gfxpayload=1920x1080x32,auto
    multiboot /known/kanarchy.bin
    module /known/lxroot.tar
    boot
}
