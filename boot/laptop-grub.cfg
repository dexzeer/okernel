# Boot menu of kanarchy-laptop.iso (an old BIOS laptop; see LAPTOP.md)
set timeout=30
set default=0
# the multiboot loader sets the video mode through these drivers (UEFI: GOP)
if [ "$grub_platform" = efi ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod all_video
fi
set gfxmode=auto
# UEFI machines have no VGA text mode: start with the report drawn on the framebuffer (entry 1b)
if [ "$grub_platform" = efi ]; then
    set default=1
fi

menuentry "1. Hardware report (text mode, legacy BIOS only)" {
    set gfxpayload=text
    multiboot /boot/kanarchy-text.bin
    boot
}
menuentry "1b. Hardware report on the screen (UEFI and BIOS)  -  START HERE" {
    multiboot /boot/kanarchy-fbtext.bin
    boot
}
menuentry "2. Desktop 1366x768" {
    multiboot /boot/kanarchy-1366x768.bin
    boot
}
menuentry "3. Desktop 1280x800" {
    multiboot /boot/kanarchy-1280x800.bin
    boot
}
menuentry "4. Desktop 1024x768" {
    multiboot /boot/kanarchy-1024x768.bin
    boot
}
menuentry "5. Desktop, let the video BIOS choose" {
    multiboot /boot/kanarchy-auto.bin
    boot
}
menuentry "6. List the video modes this laptop offers (photograph it)" {
    insmod all_video
    set pager=1
    videoinfo
    echo
    echo "Press the Escape key, or wait two minutes, to go back to the menu."
    sleep --interruptible 120
}
