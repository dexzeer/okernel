# Boot menu of kanarchy-laptop.iso (an old BIOS laptop; see LAPTOP.md)
set timeout=30
set default=0

menuentry "1. Hardware report (text mode)  -  START HERE" {
    set gfxpayload=text
    multiboot /boot/kanarchy-text.bin
    boot
}
menuentry "2. Desktop 1366x768" {
    multiboot /boot/kanarchy-1366x768.bin
    boot
}
menuentry "3. Desktop 1280x800" {
    multiboot /boot/kanarchy-1280x800.bin
    boot
}
menuentry "4. Desktop 1024x768" {
    multiboot /boot/kanarchy-1024x768.bin
    boot
}
menuentry "5. Desktop, let the video BIOS choose" {
    multiboot /boot/kanarchy-auto.bin
    boot
}
menuentry "6. List the video modes this laptop offers (photograph it)" {
    insmod all_video
    set pager=1
    videoinfo
    echo
    echo "Press the Escape key, or wait two minutes, to go back to the menu."
    sleep --interruptible 120
}
