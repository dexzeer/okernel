<!doctype html><html><head><style>
body{margin:0}
#abs{position:absolute;top:0;left:0;right:0;height:100px}
#fix{position:fixed;top:0;width:100%;height:20px;background:#f00}
#flex{display:flex;justify-content:space-around;width:100px}
#flex2{display:flex;justify-content:space-around;width:100px;height:10px}
#spacer{height:3000px}
#grow{width:100px;height:0}
#far{position:absolute;left:0;top:2500px;width:10px;height:10px;background:#00f}
</style></head><body>
<div id="abs"><div id="fix"></div></div>
<div id="flex"></div><div id="flex2"><span style="display:none"></span></div>
<div id="grow"></div><div id="spacer"></div><div id="far"></div>
<script>
// Layout/script-API fixes needed by YouTube's home page (every one of them left it blank):
//  1. a position:fixed box inside an absolutely positioned ancestor is laid out (it used to stay 0x0),
//  2. an empty flex line with justify-content:space-around does not divide by zero,
//  3. an element created a moment ago is measured for real (the rate-limited script layout used to say 0),
//  4. IntersectionObserverEntry exists (pages feature-detect it), and Resize/IntersectionObservers report CHANGES.
const bad = [];
const need = (ok, what) => { if (!ok) bad.push(what); };
const rect = id => document.getElementById(id).getBoundingClientRect();

need(rect('fix').width === innerWidth && rect('fix').height === 20, 'fixed box in abs ancestor: ' + rect('fix').width + 'x' + rect('fix').height);
need(rect('flex').width === 100, 'empty space-around flex: ' + rect('flex').width);

const e = document.createElement('div');
e.style.cssText = 'width:40px;height:30px';
document.body.appendChild(e);
const er = e.getBoundingClientRect();
need(er.width === 40 && er.height === 30, 'fresh element measured: ' + er.width + 'x' + er.height);
e.remove();

need(!document.all && document.all !== undefined && document.all !== null, 'document.all must be falsy but not undefined (YouTube sanitizer: value || value === document.all)');
need(typeof IntersectionObserverEntry === 'function' && 'intersectionRatio' in IntersectionObserverEntry.prototype, 'IntersectionObserverEntry');

const events = [];
const ro = new ResizeObserver(es => { for (const x of es) events.push('ro ' + Math.round(x.contentRect.height)); });
const grow = document.getElementById('grow');
ro.observe(grow);                                   // 100x0 differs from the 0x0 nothing has been reported at: one delivery
const far = document.getElementById('far');
const io = new IntersectionObserver(es => { for (const x of es) events.push('io ' + x.isIntersecting); });
io.observe(far);                                    // 2500px down: the first delivery says "not intersecting"

setTimeout(() => { grow.style.height = '50px'; far.style.top = '10px'; }, 100);        // size appears, the box comes into view
setTimeout(() => { grow.style.height = '80px'; }, 300);
setTimeout(() => {
    const want = ['ro 0', 'io false', 'ro 50', 'io true', 'ro 80'];
    const got = events.slice();
    need(got.length === 5 && want.every(w => got.includes(w)) && got.indexOf('ro 0') < got.indexOf('ro 50') && got.indexOf('ro 50') < got.indexOf('ro 80') &&
         got.indexOf('io false') < got.indexOf('io true'),
         'observer events: ' + got.join(','));
    io.disconnect(); ro.disconnect();
    console.log('RESULT ' + (bad.length ? 'FAIL ' + bad.join(' | ') : 'ALLPASS'));
}, 700);
</script></body></html>
