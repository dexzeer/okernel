<!doctype html><html><head></head><body><script>
var f = document.createElement('iframe');
f.style.display = 'none';
f.sandbox = 'allow-same-origin';
f.src = 'about:blank';
document.body.appendChild(f);
var w = f.contentWindow;
var out = [];
out.push('cw=' + (w ? 'object' : String(w)));
try { out.push('same=' + (w === window)); } catch (e) { out.push('same:err'); }
try { out.push('nav=' + (w && w.navigator ? w.navigator.language : 'none')); } catch (e) { out.push('nav:err ' + e.message); }
try { out.push('doc=' + (f.contentDocument ? f.contentDocument.nodeName : String(f.contentDocument))); } catch (e) { out.push('doc:err'); }
try { out.push('objproto=' + (w && w.Object ? (w.Object !== Object) : 'none')); } catch (e) { out.push('obj:err'); }
try { out.push('toString=' + (w && w.Function ? w.Function.prototype.toString.call(w.Function) : 'none').slice(0, 30)); } catch (e) { out.push('fn:err'); }
console.log('IFRAME ' + out.join(' | '));
</script></body></html>
